
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundUp - Registro y Contacto</title>

    <style>
        body {
            font-family: system-ui, Arial, sans-serif;
            background-color: #f3efff;
            color: #29213d;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #7041c5;
        }

        h2 {
            color: #7041c5;
        }

        p {
            text-align: center;
        }

        section {
            background-color: white;
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        fieldset {
            border: 1px solid #d5c6f5;
            border-radius: 10px;
            margin-top: 20px;
            padding: 15px;
        }

        fieldset label {
            display: inline-block;
            margin-right: 15px;
        }

        button {
            background-color: #7041c5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #512c96;
        }
    </style>
</head>

<body>

    <h1>SoundUp</h1>
    <p>Descubrí música nueva, creá playlists y conectate con tus artistas favoritos.</p>

    <!-- FORMULARIO DE REGISTRO -->

    <section>
        <h2>Crear una cuenta</h2>

        <form action="TU_ENDPOINT_DE_REGISTRO" method="POST">

            <fieldset>
                <legend>Datos personales</legend>

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre"
                    placeholder="Ingresá tu nombre completo"
                    autocomplete="name" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email"
                    placeholder="ejemplo@gmail.com"
                    autocomplete="email" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8" autocomplete="new-password" required>

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad"
                    min="13" max="100" required>

                <label for="fecha">Fecha de nacimiento:</label>
                <input type="date" id="fecha" name="fecha"
                    autocomplete="bday" required>

                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" name="usuario"
                    placeholder="Entre 5 y 12 caracteres"
                    pattern="[a-zA-Z0-9]{5,12}"
                    minlength="5" maxlength="12"
                    title="Debe contener entre 5 y 12 letras o números, sin espacios."
                    required>
            </fieldset>

            <fieldset>
                <legend>Ubicación</legend>

                <label for="pais">País:</label>
                <select id="pais" name="pais" required>
                    <option value="">Seleccioná tu país</option>
                    <option value="Argentina">Argentina</option>
                    <option value="Chile">Chile</option>
                    <option value="Uruguay">Uruguay</option>
                    <option value="Brasil">Brasil</option>
                    <option value="España">España</option>
                    <option value="Otro">Otro</option>
                </select>

                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad"
                    list="ciudades"
                    placeholder="Escribí tu ciudad"
                    required>

                <datalist id="ciudades">
                    <option value="Buenos Aires">
                    <option value="Córdoba">
                    <option value="Rosario">
                    <option value="Montevideo">
                    <option value="Santiago">
                    <option value="Madrid">
                </datalist>
            </fieldset>

            <fieldset>
                <legend>Preferencias musicales</legend>

                <p>Género:</p>

                <label>
                    <input type="radio" name="genero" value="Femenino" required>
                    Femenino
                </label>

                <label>
                    <input type="radio" name="genero" value="Masculino">
                    Masculino
                </label>

                <label>
                    <input type="radio" name="genero" value="Otro">
                    Otro
                </label>

                <label>
                    <input type="radio" name="genero" value="Prefiero no decir">
                    Prefiero no decir
                </label>

                <p>¿Qué música te gusta?</p>

                <label>
                    <input type="checkbox" name="intereses" value="Pop">
                    Pop
                </label>

                <label>
                    <input type="checkbox" name="intereses" value="Rock">
                    Rock
                </label>

                <label>
                    <input type="checkbox" name="intereses" value="Reggaeton">
                    Reggaeton
                </label>

                <label>
                    <input type="checkbox" name="intereses" value="Electronica">
                    Electrónica
                </label>

                <label>
                    <input type="checkbox" name="intereses" value="Clasica">
                    Música clásica
                </label>

                <label for="bio">Contanos un poco sobre vos:</label>
                <textarea id="bio" name="biografia"
                    placeholder="Escribí una breve biografía..."
                    maxlength="200" rows="4"></textarea>

            </fieldset>

            <button type="submit">Crear cuenta</button>

        </form>
    </section>


    <!-- FORMULARIO DE CONTACTO -->

    <section>
        <h2>Contactanos</h2>

        <p>¿Tenés algún problema? Nuestro equipo está para ayudarte.</p>

        <form action="TU_ENDPOINT_DE_CONTACTO" method="POST">

            <label for="nombre-contacto">Nombre:</label>
            <input type="text" id="nombre-contacto"
                name="nombre" placeholder="Tu nombre"
                autocomplete="name" required>

            <label for="email-contacto">Email:</label>
            <input type="email" id="email-contacto"
                name="email" placeholder="Tu correo electrónico"
                autocomplete="email" required>

            <label for="motivo">Motivo de contacto:</label>
            <select id="motivo" name="motivo" required>
                <option value="">Seleccioná un motivo</option>
                <option value="Problema tecnico">Problema técnico</option>
                <option value="Cuenta">Problema con mi cuenta</option>
                <option value="Suscripcion">Suscripción</option>
                <option value="Otro">Otro</option>
            </select>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje"
                placeholder="Contanos cómo podemos ayudarte..."
                rows="5" required></textarea>

            <label>
                <input type="checkbox" id="terminos"
                    name="terminos" value="Aceptados" required>
                Acepto los términos y condiciones.
            </label>

            <button type="submit">Enviar mensaje</button>

        </form>
    </section>

</body>
</html>
